<!DOCTYPE html>
<html lang="en" data-theme="masjid">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Masjid Management System</title>
    <link rel="stylesheet" href="output.css" />
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <link href="https://api.fontshare.com/v2/css?f[]=cabinet-grotesk@100,200,300,400,500,700,800,900,1&display=swap" rel="stylesheet">
  </head>
  <body class="font-display">
    <main class="card">
      <div class="card-body w-96 mx-auto flex input-error">
        <h2 class="card-title">Masjid Management</h2>
        <form id="loginForm">
  <div class="form-control">
    <label class="label">
      <span class="label-text">Username</span>
    </label>
    <div class="relative flex items-center gap-2">
      <i class="ph-fill ph-user ph-lg opacity-70 absolute left-2"></i>
      <input
        type="text"
        name="username"
        placeholder="Enter your Username"
        class="input input-bordered pl-8 w-96"
        required
      />
    </div>
  </div>
  <div class="form-control">
    <label class="label">
      <span class="label-text">Password</span>
    </label>
    <div class="relative flex items-center gap-2">
      <i class="ph-fill ph-lock ph-lg opacity-70 absolute left-2"></i>
      <input
        type="password"
        name="password"
        placeholder="Enter your Password"
        class="input input-bordered pl-8 w-96"
        required
      />
    </div>
  </div>
  <button
    type="submit"
    class="btn btn-primary mt-5 w-full hover:-translate-y-1"
  >
    Login
  </button>
</form>
    </main>
    <script src="app.js"></script>
  </body>
</html>
