<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Masjid Management - Main</title>
  <link rel="stylesheet" href="/output.css" />
  <!-- Feather Icons -->
  <script src="https://unpkg.com/feather-icons"></script>
  <style>
    @media (max-width: 768px) {
      .sidebar {
        width: 0;
        overflow: hidden;
        transition: width 0.3s ease-in-out;
      }
      .sidebar.open {
        width: 250px;
      }
      .main-content {
        margin-left: 0;
        width: 100%;
      }
    }
    @media (min-width: 769px) {
      .sidebar {
        width: 250px;
      }
      .main-content {
        margin-left: 250px;
        width: calc(100% - 250px);
      }
    }
  </style>
</head>
<body class="bg-gray-100 min-h-screen">
  <div class="flex h-screen overflow-hidden">
    <!-- Sidebar -->
    <div id="sidebar" class="sidebar fixed top-0 left-0 h-full bg-gray-200 border-r border-gray-300 z-30">
      <div class="p-4 border-b border-gray-300">
        <h1 class="text-xl font-semibold flex items-center">
          <i data-feather="home" class="mr-2 h-5 w-5"></i> Masjid Management
        </h1>
      </div>
      <ul class="menu p-4 space-y-2">
        <li>
          <a href="#" class="active bg-emerald-100 text-emerald-800 hover:bg-emerald-200 rounded-md flex items-center" data-member-type="janaza">
            <i data-feather="users" class="h-5 w-5 mr-2"></i> Janaza Member Details
          </a>
        </li>
        <li>
          <a href="#" class="hover:bg-gray-300 rounded-md flex items-center" data-member-type="mahallah">
            <i data-feather="users" class="h-5 w-5 mr-2"></i> Mahallah Member Details
          </a>
        </li>
        <li>
          <a href="#" class="hover:bg-gray-300 rounded-md flex items-center" data-member-type="hifl">
            <i data-feather="book" class="h-5 w-5 mr-2"></i> Hifl Madrasa Details
          </a>
        </li>
      </ul>
    </div>

    <!-- Main Content -->
    <div class="main-content flex flex-col h-screen overflow-hidden">
      <!-- Mobile Header with Sidebar Toggle -->
      <div class="md:hidden bg-white p-4 border-b border-gray-300 flex items-center">
        <button id="sidebar-toggle" class="btn btn-ghost btn-sm mr-2">
          <i data-feather="menu" class="h-5 w-5"></i>
        </button>
        <h1 class="text-xl font-semibold">Masjid Management</h1>
      </div>

      <!-- Header -->
      <header class="bg-white shadow-sm p-4 flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
        <h2 id="location-title" class="text-xl font-semibold">Select a Location</h2>
        <div class="flex flex-col md:flex-row gap-2 w-full md:w-auto">
          <div class="flex flex-col md:flex-row gap-2 w-full md:w-auto">
            <select id="location-select" class="select select-bordered bg-emerald-100 text-emerald-800 border-emerald-200 w-full md:w-48">
              <option value="" disabled selected>Select Location</option>
              <option value="Colombo">Colombo</option>
              <option value="Kandy">Kandy</option>
              <option value="Galle">Galle</option>
              <option value="Jaffna">Jaffna</option>
              <option value="Batticaloa">Batticaloa</option>
            </select>
            
            <select id="zone-select" class="select select-bordered bg-emerald-100 text-emerald-800 border-emerald-200 w-full md:w-48 hidden">
              <option value="" disabled selected>Zones</option>
              <option value="Zone 1">Zone 1</option>
              <option value="Zone 2">Zone 2</option>
              <option value="Zone 3">Zone 3</option>
              <option value="Zone 4">Zone 4</option>
            </select>
          </div>
          <!-- Admin/Member Add Buttons Removed -->
        </div>
      </header>

      <!-- Table -->
      <main class="flex-1 overflow-auto p-4">
        <div class="bg-white rounded-lg shadow overflow-hidden">
          <div class="overflow-x-auto">
            <table class="table w-full">
              <thead>
                <tr>
                  <th class="bg-gray-50">Name</th>
                  <th class="bg-gray-50">Phone Number</th>
                  <th class="bg-gray-50">Address</th>
                  <th class="bg-gray-50">Payment Status</th>
                  <th class="bg-gray-50">Action</th>
                </tr>
              </thead>
              <tbody id="table-body">
                <tr>
                  <td colspan="5" class="text-center py-16 text-gray-500">
                    Please Select a Location to Display Data
                  </td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>
      </main>
    </div>
  </div>

  <!-- Admin Modals Removed -->

  <!-- JavaScript -->
  <script src="/js/main.js"></script>
</body>
</html>
